# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name n8n.devspoon.com www.n8n.devspoon.com;

    # Let's Encrypt 갱신용
    location ^~ /.well-known/acme-challenge/ {
        root /www/n8n;
        try_files $uri =404;
        allow all;
    }

    # HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 설정
server {
    listen 443 ssl http2;
    server_name n8n.devspoon.com www.n8n.devspoon.com;

    # SSL 인증서
    ssl_certificate /etc/letsencrypt/live/n8n.devspoon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.devspoon.com/privkey.pem;

    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /log/nginx/n8n.com.gunicorn_access.log main;
    error_log /log/nginx/n8n.com.gunicorn_error.log warn;

    # n8n 프록시
    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # Block dot file
    location ~ /\. {
        deny all;
    }

    # Block sensitive files
    location ~* \.(log|binary|pem|enc|crt|conf|cnf|sql|sh|key|yml|lock)$ {
        deny all;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    if ($bad_bot) {
        return 403;
    }
}